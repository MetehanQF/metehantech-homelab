name: metehantech-mqtt
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: metehantech-mosquitto
    user: "1000:1000"
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./config:/mosquitto/config:ro
      - ./data:/mosquitto/data
      - ./log:/mosquitto/log
    networks:
      camera:
        aliases: [metehantech-mosquitto]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
networks:
  camera:
    external: true
    name: metehantech-camera_default
