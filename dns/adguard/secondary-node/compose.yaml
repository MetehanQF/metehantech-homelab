name: metehantech-dns

# AdGuard Home SECONDARY resolver. Bind addresses come from .env (see
# ../../../config.example.env). ':?' makes a missing value a hard error:
# falling back to 0.0.0.0 would publish an open resolver.
#
# Deliberately mirrors the Pi5 primary so a client gets the same answer whichever
# resolver it picks. Differences from Pi5 are only the things that MUST differ:
# bind addresses and the admin credential.
#
# Security posture:
#   * non-root (uid/gid injected by deploy.sh), all capabilities dropped except the
#     one the shipped binary needs to exec, no-new-privileges
#   * no Docker socket, no host network, no host filesystem beyond ./conf and ./work
#   * DNS listens on unprivileged 3053 INSIDE the container; dockerd's DNAT owns :53
#   * published to specific host addresses ONLY — never 0.0.0.0. PcOld has an active
#     ufw, but Docker's DNAT bypasses ufw's INPUT chain, so address-scoping is what
#     actually confines this, exactly as on Pi5.
#   * image pinned to the same multi-arch digest as Pi5 (v0.107.79); the OCI index
#     covers linux/amd64 and linux/arm64, so both nodes run byte-identical releases.

services:
  adguardhome:
    image: adguard/adguardhome@sha256:aba9e3bf0613be3ba3755e1fc311b126e2c24bec25e18b6483894a88283074f0
    container_name: metehantech-adguard
    user: "${AGH_UID}:${AGH_GID}"
    restart: unless-stopped
    cap_drop: [ALL]
    # The shipped AdGuardHome binary carries cap_net_bind_service as a FILE capability;
    # with an empty bounding set execve() itself fails with EPERM. This is the only
    # capability granted, and the DNS listener is unprivileged (3053) regardless.
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    ports:
      # --- DNS: LAN ---
      - "${SECONDARY_NODE_IP:?SECONDARY_NODE_IP required}:53:3053/udp"
      - "${SECONDARY_NODE_IP:?SECONDARY_NODE_IP required}:53:3053/tcp"
      # --- DNS: Tailscale ---
      - "${SECONDARY_NODE_TAILSCALE_IP:?SECONDARY_NODE_TAILSCALE_IP required}:53:3053/udp"
      - "${SECONDARY_NODE_TAILSCALE_IP:?SECONDARY_NODE_TAILSCALE_IP required}:53:3053/tcp"
      # --- Admin UI / API: loopback, LAN, Tailscale. Never public. ---
      - "127.0.0.1:3000:3000/tcp"
      - "${SECONDARY_NODE_IP:?SECONDARY_NODE_IP required}:3000:3000/tcp"
      - "${SECONDARY_NODE_TAILSCALE_IP:?SECONDARY_NODE_TAILSCALE_IP required}:3000:3000/tcp"
    volumes:
      - ./conf:/opt/adguardhome/conf
      - ./work:/opt/adguardhome/work
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/login.html && nc -z 127.0.0.1 3053"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # PcOld has 3 GB RAM and also serves NFS, Portainer and Uptime Kuma. AdGuard
    # measured ~50 MB on Pi5; this cap is a guard rail, not a reservation.
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

networks:
  default:
    name: metehantech-dns_default
