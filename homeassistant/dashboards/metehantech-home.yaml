        {% else %}Henüz bildirim olayı yok.{% endfor %}'
      card_mod: *id001
    - type: markdown
      title: Mevcut Alert Center geçmişi
      content: '{% for e in (state_attr(''sensor.mt_runtime'',''history'') or [])[:10] %}

        • {{ as_local(as_datetime(e.created_at)).strftime(''%d.%m %H:%M'') }} · {{ e.severity }} · {{ e.title }} · {{ ''düzeldi'' if e.status==''resolved''
        else ''aktif'' }}

        {% endfor %}'
      card_mod: *id001
