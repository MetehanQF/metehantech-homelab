# metehantech-kiosk-nav
title: MetehanTech Home
kiosk_mode:
  kiosk: "[[[\n  const ua = String(user_agent || navigator.userAgent || '');\n  const isFully = typeof window.fully !== 'undefined' || /Fully/i.test(ua);\n\
    \  const onThisDashboard = window.location.pathname.startsWith('/metehantech-home/');\n  return onThisDashboard && isFully;\n]]]"
views:
- title: Home
  path: home
  icon: mdi:home-variant
  type: sections
  max_columns: 3
  dense_section_placement: false
  theme: MetehanTech Dark
  sections:
  - type: grid
    column_span: 3
    cards:
    - type: horizontal-stack
      cards:
      - type: custom:mushroom-template-card
        icon: mdi:home-variant
        primary: Ana
        layout: vertical
        fill_container: true
        tap_action:
          action: navigate
          navigation_path: /metehantech-home/home
        card_mod:
          style: "ha-card {\n  background:\n    linear-gradient(152deg,\n      rgba(139, 92, 246, 0.34) 0%,\n      rgba(99, 102, 241, 0.18) 100%)\
            \ !important;\n  border-color: rgba(139, 92, 246, 0.62) !important;\n  box-shadow:\n    0 16px 38px -18px rgba(139, 92, 246, 0.70),\n\
            \    inset 0 1px 0 rgba(255, 255, 255, 0.12) !important;\n  --card-primary-color: #FFFFFF;\n}\nmushroom-shape-icon {\n  --icon-color:\
            \ #FFFFFF !important;\n  --shape-color: rgba(139, 92, 246, 0.40) !important;\n}\nha-card:active { transform: scale(0.962); }\n"
      - type: custom:mushroom-template-card
        icon: mdi:lightbulb-group
        primary: Işıklar
        layout: vertical
        fill_container: true
        tap_action:
          action: navigate
          navigation_path: /metehantech-home/lights
        card_mod:
          style: "ha-card {\n  --card-primary-color: #9A8DB8;\n}\nmushroom-shape-icon {\n  --icon-color: rgba(167, 155, 192, 0.92) !important;\n\
            \  --shape-color: rgba(139, 92, 246, 0.12) !important;\n}\nha-card:active { transform: scale(0.962); }\n"
      - type: custom:mushroom-template-card
        icon: mdi:palette-swatch-variant
        primary: Modlar
        layout: vertical
        fill_container: true
        tap_action:
          action: navigate
          navigation_path: /metehantech-home/modes
        card_mod:
          style: "ha-card {\n  --card-primary-color: #9A8DB8;\n}\nmushroom-shape-icon {\n  --icon-color: rgba(167, 155, 192, 0.92) !important;\n\
            \  --shape-color: rgba(139, 92, 246, 0.12) !important;\n}\nha-card:active { transform: scale(0.962); }\n"
      - type: custom:mushroom-template-card
        icon: mdi:shield-home
        primary: Güvenlik
        layout: vertical
        fill_container: true
        tap_action:
          action: navigate
          navigation_path: /metehantech-home/security
        card_mod:
          style: "ha-card {\n  --card-primary-color: #9A8DB8;\n}\nmushroom-shape-icon {\n  --icon-color: rgba(167, 155, 192, 0.92) !important;\n\
            \  --shape-color: rgba(139, 92, 246, 0.12) !important;\n}\nha-card:active { transform: scale(0.962); }\n"
      - type: custom:mushroom-template-card
        icon: mdi:server
        primary: Sistem
        layout: vertical
        fill_container: true
        tap_action:
          action: navigate
          navigation_path: /metehantech-home/systems
        card_mod:
          style: "ha-card {\n  --card-primary-color: #9A8DB8;\n}\nmushroom-shape-icon {\n  --icon-color: rgba(167, 155, 192, 0.92) !important;\n\
            \  --shape-color: rgba(139, 92, 246, 0.12) !important;\n}\nha-card:active { transform: scale(0.962); }\n"
      - type: custom:mushroom-template-card
        primary: Otomasyon
        icon: mdi:robot
        layout: vertical
        fill_container: true
        tap_action:
          action: navigate
          navigation_path: /metehantech-home/automations
        card_mod:
          style: 'ha-card { background: linear-gradient(158deg, rgba(52,33,79,.70), rgba(21,14,32,.74)); border: 1px solid rgba(139,92,246,.16);
            border-radius: 22px; box-shadow: 0 0 22px -14px rgba(139,92,246,.35); }'
  - type: grid
    cards:
    - type: custom:mushroom-template-card
      entity: input_select.metehantech_mode
      primary: Ev · {{ states('input_select.metehantech_mode') }}
      secondary: '{{ ''Otomasyonlar duraklatıldı · kritik korumalar aktif'' if is_state(''input_boolean.metehantech_pause'',''on'') else (''Metrik
        bekleniyor'' if state_attr(''sensor.mt_active_alerts'',''unknown_count'')|int(0)>0 and is_state(''sensor.mt_active_alerts'',''0'') else
        (''✓ Sistem normal'' if is_state(''sensor.mt_active_alerts'',''0'') else states(''sensor.mt_active_alerts'') ~ '' aktif uyarı'')) }}'
      icon: mdi:home-switch
      icon_color: '{{ ''red'' if states(''sensor.mt_active_alerts'')|int(0)>0 else ''purple'' }}'
      tap_action:
        action: more-info
      card_mod: &id001
        style: 'ha-card { background: linear-gradient(158deg, rgba(52,33,79,.70), rgba(21,14,32,.74)); border: 1px solid rgba(139,92,246,.16);
          border-radius: 22px; box-shadow: 0 0 22px -14px rgba(139,92,246,.35); }'
    - type: conditional
      conditions:
      - entity: sensor.mt_active_alerts
        state_not: '0'
      - entity: sensor.mt_active_alerts
        state_not: unavailable
      - entity: sensor.mt_active_alerts
        state_not: unknown
      card:
        type: markdown
        title: Aktif Uyarılar
        content: '{% set ids=state_attr(''sensor.mt_active_alerts'',''entities'') or [] %}

          {% for e in ids %}{% if states(e) in [''WARNING'',''CRITICAL''] %}

          {{ ''🔴'' if states(e)==''CRITICAL'' else ''⚠'' }} {{ state_attr(e,''friendly_label'') }}

          {% endif %}{% endfor %}

          {% for a in (state_attr(''sensor.mt_runtime'',''alerts'') or [])[:5] %}

          {{ ''🔴'' if a.severity==''critical'' else ''⚠'' }} {{ a.title }}

          {% endfor %}'
        card_mod: *id001
    - type: custom:mushroom-template-card
      icon: '{%- set c = states(''weather.forecast_home'') -%}{{- {''clear-night'': ''mdi:weather-night'', ''cloudy'': ''mdi:weather-cloudy'',
        ''fog'': ''mdi:weather-fog'', ''hail'': ''mdi:weather-hail'', ''lightning'': ''mdi:weather-lightning'', ''lightning-rainy'': ''mdi:weather-lightning-rainy'',
        ''partlycloudy'': ''mdi:weather-partly-cloudy'', ''pouring'': ''mdi:weather-pouring'', ''rainy'': ''mdi:weather-rainy'', ''snowy'': ''mdi:weather-snowy'',
        ''snowy-rainy'': ''mdi:weather-snowy-rainy'', ''sunny'': ''mdi:weather-sunny'', ''windy'': ''mdi:weather-windy'', ''windy-variant'': ''mdi:weather-windy-variant''}.get(c,
        ''mdi:weather-cloudy'') -}}'
      primary: '{{ now().strftime(''%H:%M'') }}'
      secondary: '{{ now().strftime(''%d.%m.%Y'') }} · {{ [''Pazartesi'', ''Salı'', ''Çarşamba'', ''Perşembe'', ''Cuma'', ''Cumartesi'', ''Pazar''][now().weekday()]
        }}'
      tap_action:
        action: none
      card_mod:
        style: "ha-card {\n  --mush-card-primary-font-size: 46px;\n  --mush-card-primary-font-weight: 300;\n  --mush-card-primary-line-height:\
          \ 1.04;\n  --mush-card-primary-letter-spacing: -1.4px;\n  --mush-card-secondary-font-size: 14px;\n  --card-primary-color: #F6F4FF;\n\
          \  --mush-icon-size: 54px;\n  padding: 6px 4px;\n  background:\n    linear-gradient(152deg,\n      rgba(139, 92, 246, 0.22) 0%,\n  \
          \    rgba(91, 42, 134, 0.14) 48%,\n      rgba(21, 14, 32, 0.74) 100%) !important;\n  border-color: rgba(139, 92, 246, 0.28) !important;\n\
          }\nmushroom-shape-icon {\n  --icon-color: rgb(183, 148, 255) !important;\n  --shape-color: rgba(139, 92, 246, 0.20) !important;\n}\n"
      grid_options:
        columns: 12
    - type: custom:mushroom-template-card
      entity: weather.forecast_home
      icon: '{%- set c = states(''weather.forecast_home'') -%}{{- {''clear-night'': ''mdi:weather-night'', ''cloudy'': ''mdi:weather-cloudy'',
        ''fog'': ''mdi:weather-fog'', ''hail'': ''mdi:weather-hail'', ''lightning'': ''mdi:weather-lightning'', ''lightning-rainy'': ''mdi:weather-lightning-rainy'',
        ''partlycloudy'': ''mdi:weather-partly-cloudy'', ''pouring'': ''mdi:weather-pouring'', ''rainy'': ''mdi:weather-rainy'', ''snowy'': ''mdi:weather-snowy'',
        ''snowy-rainy'': ''mdi:weather-snowy-rainy'', ''sunny'': ''mdi:weather-sunny'', ''windy'': ''mdi:weather-windy'', ''windy-variant'': ''mdi:weather-windy-variant''}.get(c,
        ''mdi:weather-cloudy'') -}}'
      icon_color: blue
      primary: Hava
      secondary: '{{ state_attr(''weather.forecast_home'', ''temperature'') | round(1) }} °C · {% set c = states(''weather.forecast_home'') %}{{
        {''clear-night'': ''Açık, gece'', ''cloudy'': ''Bulutlu'', ''fog'': ''Puslu'', ''hail'': ''Dolu'', ''lightning'': ''Gök gürültülü'', ''lightning-rainy'':
        ''Gök gürültülü sağanak'', ''partlycloudy'': ''Parçalı bulutlu'', ''pouring'': ''Şiddetli yağış'', ''rainy'': ''Yağmurlu'', ''snowy'':
        ''Karlı'', ''snowy-rainy'': ''Karla karışık yağmur'', ''sunny'': ''Güneşli'', ''windy'': ''Rüzgârlı'', ''windy-variant'': ''Rüzgârlı'',
        ''exceptional'': ''Olağan dışı''}.get(c, c) }}'
      tap_action:
        action: more-info
      card_mod:
        style: 'ha-card:active { transform: scale(0.962); }

          '
      grid_options:
        columns: 6
    - type: custom:mushroom-template-card
      entity: person.metehan
      icon: '{{ ''mdi:home-account'' if is_state(''person.metehan'', ''home'') else ''mdi:home-export-outline'' }}'
      icon_color: '{{ ''teal'' if is_state(''person.metehan'', ''home'') else ''amber'' }}'
      primary: Metehan
      secondary: '{{ ''Evde'' if is_state(''person.metehan'', ''home'') else ''Dışarıda'' if is_state(''person.metehan'', ''not_home'') else states(''person.metehan'')
        }}'
      tap_action:
        action: more-info
      card_mod:
        style: 'ha-card:active { transform: scale(0.962); }

          '
      grid_options:
        columns: 6
    - type: custom:mushroom-chips-card
      alignment: start
      chips:
      - type: template
        entity: weather.forecast_home
        icon: mdi:water-percent
        icon_color: blue
        content: '{{ state_attr(''weather.forecast_home'', ''humidity'') | int(0) }}%'
        tap_action:
          action: more-info
      - type: template
        entity: weather.forecast_home
        icon: mdi:weather-windy
        icon_color: teal
        content: '{{ state_attr(''weather.forecast_home'', ''wind_speed'') | round(0) }} km/s'
        tap_action:
          action: more-info
      - type: template
        entity: weather.forecast_home
        icon: mdi:white-balance-sunny
        icon_color: amber
        content: UV {{ state_attr('weather.forecast_home', 'uv_index') | round(1) }}
        tap_action:
          action: more-info
      card_mod:
        style: "ha-card {\n  background: none !important;\n  border: none !important;\n  box-shadow: none !important;\n  -webkit-backdrop-filter:\
          \ none !important;\n  backdrop-filter: none !important;\n}\n"
      grid_options:
        columns: 12
    - type: weather-forecast
      entity: weather.forecast_home
      forecast_type: daily
      show_forecast: true
      show_current: false
      card_mod:
        style: "ha-card {\n  padding: 4px 10px 10px 10px;\n  overflow: hidden;\n}\nha-card .content {\n  padding-top: 4px;\n}\n"
      grid_options:
        columns: 12
    - type: conditional
      conditions:
      - condition: or
        conditions:
        - condition: state
          entity: weather.forecast_home
          state: exceptional
        - condition: state
          entity: weather.forecast_home
          state: hail
        - condition: state
          entity: weather.forecast_home
          state: lightning-rainy
        - condition: state
          entity: weather.forecast_home
          state: pouring
      card:
        type: entities
        title: Hava uyarısı
        show_header_toggle: false
        entities:
        - weather.forecast_home
        card_mod: *id001
  - type: grid
    cards:
    - type: custom:mushroom-title-card
      title: Ev kontrolü
      subtitle: '{%- set n = [''light.odam_lamba'', ''light.oda_2'', ''light.oda_3'', ''light.oda_4''] | select(''is_state'', ''on'') | list |
        count -%}{{ n }}/4 ampul açık · masa {{ ''açık'' if is_state(''light.masa_ambiyans'', ''on'') else ''kapalı'' }}'
      card_mod:
        style: "ha-card {\n  background: none !important;\n  border: none !important;\n  box-shadow: none !important;\n  -webkit-backdrop-filter:\
          \ none !important;\n  backdrop-filter: none !important;\n}\n"
      grid_options:
        columns: 12
    - type: custom:mushroom-light-card
      entity: light.tum_isiklar
      name: Dört ampul
      icon: mdi:lightbulb
      use_light_color: true
      show_brightness_control: true
      show_color_temp_control: true
      show_color_control: false
      collapsible_controls: false
      tap_action:
        action: more-info
      hold_action:
        action: more-info
      double_tap_action:
        action: toggle
      card_mod:
        style: "{%- set s = states('light.tum_isiklar') -%}\n{%- set c = state_attr('light.tum_isiklar', 'rgb_color') or [251, 191, 36] -%}\n\
          {%- set b = (state_attr('light.tum_isiklar', 'brightness') | float(0)) / 255 -%}\n{% if s == 'on' %}\nha-card {\n  background:\n   \
          \ linear-gradient(152deg,\n      rgba({{ c[0] }}, {{ c[1] }}, {{ c[2] }}, {{ (0.10 + 0.17 * b) | round(3) }}) 0%,\n      rgba(31, 20,\
          \ 47, 0.66) 60%,\n      rgba(21, 14, 32, 0.74) 100%) !important;\n  border-color: rgba({{ c[0] }}, {{ c[1] }}, {{ c[2] }}, {{ (0.20\
          \ + 0.20 * b) | round(3) }}) !important;\n  box-shadow:\n    0 16px 42px -20px rgba({{ c[0] }}, {{ c[1] }}, {{ c[2] }}, {{ (0.28 + 0.30\
          \ * b) | round(3) }}),\n    inset 0 1px 0 rgba(255, 255, 255, 0.07) !important;\n}\n{% endif %}\nha-card:active { transform: scale(0.962);\
          \ }\n"
      grid_options:
        columns: 12
    - type: custom:mushroom-template-card
      icon: mdi:lightbulb-group
      primary: Aç
      secondary: Dört ampul
      tap_action:
        action: perform-action
        perform_action: light.turn_on
        target:
          entity_id: light.tum_isiklar
      card_mod:
        style: "ha-card {\n  background:\n    linear-gradient(152deg,\n      rgba(139, 92, 246, 0.17) 0%,\n      rgba(31, 20, 47, 0.66) 62%,\n\
          \      rgba(21, 14, 32, 0.74) 100%) !important;\n  border-color: rgba(139, 92, 246, 0.34) !important;\n  box-shadow:\n    0 14px 36px\
          \ -20px rgba(139, 92, 246, 0.5),\n    inset 0 1px 0 rgba(255, 255, 255, 0.06) !important;\n}\nmushroom-shape-icon {\n  --icon-color:\
          \ rgb(139, 92, 246) !important;\n  --shape-color: rgba(139, 92, 246, 0.22) !important;\n}\nha-card:active { transform: scale(0.962);\
          \ }\n"
      grid_options:
        columns: 6
    - type: custom:mushroom-template-card
      icon: mdi:lightbulb-group-off
      primary: Kapat
      secondary: Dört ampul
      tap_action:
        action: perform-action
        perform_action: light.turn_off
        target:
          entity_id: light.tum_isiklar
      card_mod:
        style: 'ha-card:active { transform: scale(0.962); }

          '
      grid_options:
        columns: 6
    - type: custom:mushroom-template-card
      icon: mdi:home
      primary: Ev
      secondary: '%70 sıcak beyaz'
      tap_action:
        action: perform-action
        perform_action: script.turn_on
        target:
          entity_id: script.metehantech_home
      card_mod:
        style: "{%- set g = states.light.tum_isiklar -%}\n{%- set m = states.light.masa_ambiyans -%}\n{%- set gon = g is not none and g.state\
          \ == 'on' -%}\n{%- set mon = m is not none and m.state == 'on' -%}\n{%- set gb = (g.attributes.brightness | default(0) | float(0) /\
          \ 2.55) if gon else -1 -%}\n{%- set mb = (m.attributes.brightness | default(0) | float(0) / 2.55) if mon else -1 -%}\n{%- set gk = (g.attributes.color_temp_kelvin\
          \ | default(0) | int(0)) if gon else 0 -%}\n{%- set mk = (m.attributes.color_temp_kelvin | default(0) | int(0)) if mon else 0 -%}\n\
          {%- set mh = (m.attributes.hs_color[0] | float(-1))\n      if (mon and m.attributes.hs_color is defined and m.attributes.hs_color) else\
          \ -1 -%}\n{%- set mode =\n      'off' if (gb < 0 and mb < 0)\n      else 'cleaning' if (gb >= 95 and mb >= 95 and 4800 <= gk <= 5200\
          \ and 4800 <= mk <= 5200)\n      else 'work' if (gb >= 72 and mb >= 92 and 3800 <= gk <= 4200 and 3800 <= mk <= 4200)\n      else 'home'\
          \ if (62 <= gb <= 78 and 22 <= mb <= 38 and 2800 <= gk <= 3200 and 2800 <= mk <= 3200)\n      else 'gaming' if (gb < 0 and 22 <= mb\
          \ <= 40 and 260 <= mh <= 290)\n      else 'movie' if (gb < 0 and 0 < mb <= 18 and 260 <= mh <= 290)\n      else 'night' if (gb < 0 and\
          \ 0 < mb <= 18 and 2000 <= mk <= 2800)\n      else 'none' -%}\n{% if mode == 'home' %}\nha-card {\n  background:\n    linear-gradient(152deg,\n\
          \      rgba(139, 92, 246, 0.30) 0%,\n      rgba(139, 92, 246, 0.11) 55%,\n      rgba(21, 14, 32, 0.74) 100%) !important;\n  border-color:\
          \ rgba(139, 92, 246, 0.62) !important;\n  box-shadow:\n    0 18px 44px -18px rgba(139, 92, 246, 0.60),\n    inset 0 1px 0 rgba(255,\
          \ 255, 255, 0.10) !important;\n  --card-primary-color: #FFFFFF;\n  --card-secondary-color: rgba(255, 255, 255, 0.78);\n}\nmushroom-shape-icon\
          \ {\n  --icon-color: #FFFFFF !important;\n  --shape-color: rgba(139, 92, 246, 0.42) !important;\n}\n{% else %}\nmushroom-shape-icon\
          \ {\n  --icon-color: rgba(139, 92, 246, 0.80) !important;\n  --shape-color: rgba(139, 92, 246, 0.13) !important;\n}\n{% endif %}\nha-card:active\
          \ { transform: scale(0.962); }\n"
      grid_options:
        columns: 6
    - type: custom:mushroom-template-card
      icon: mdi:weather-night
      primary: Gece
      secondary: Sadece masa %10
      tap_action:
        action: perform-action
        perform_action: script.turn_on
        target:
          entity_id: script.metehantech_night
      card_mod:
        style: "{%- set g = states.light.tum_isiklar -%}\n{%- set m = states.light.masa_ambiyans -%}\n{%- set gon = g is not none and g.state\
          \ == 'on' -%}\n{%- set mon = m is not none and m.state == 'on' -%}\n{%- set gb = (g.attributes.brightness | default(0) | float(0) /\
          \ 2.55) if gon else -1 -%}\n{%- set mb = (m.attributes.brightness | default(0) | float(0) / 2.55) if mon else -1 -%}\n{%- set gk = (g.attributes.color_temp_kelvin\
          \ | default(0) | int(0)) if gon else 0 -%}\n{%- set mk = (m.attributes.color_temp_kelvin | default(0) | int(0)) if mon else 0 -%}\n\
          {%- set mh = (m.attributes.hs_color[0] | float(-1))\n      if (mon and m.attributes.hs_color is defined and m.attributes.hs_color) else\
          \ -1 -%}\n{%- set mode =\n      'off' if (gb < 0 and mb < 0)\n      else 'cleaning' if (gb >= 95 and mb >= 95 and 4800 <= gk <= 5200\
          \ and 4800 <= mk <= 5200)\n      else 'work' if (gb >= 72 and mb >= 92 and 3800 <= gk <= 4200 and 3800 <= mk <= 4200)\n      else 'home'\
          \ if (62 <= gb <= 78 and 22 <= mb <= 38 and 2800 <= gk <= 3200 and 2800 <= mk <= 3200)\n      else 'gaming' if (gb < 0 and 22 <= mb\
          \ <= 40 and 260 <= mh <= 290)\n      else 'movie' if (gb < 0 and 0 < mb <= 18 and 260 <= mh <= 290)\n      else 'night' if (gb < 0 and\
          \ 0 < mb <= 18 and 2000 <= mk <= 2800)\n      else 'none' -%}\n{% if mode == 'night' %}\nha-card {\n  background:\n    linear-gradient(152deg,\n\
          \      rgba(99, 102, 241, 0.30) 0%,\n      rgba(99, 102, 241, 0.11) 55%,\n      rgba(21, 14, 32, 0.74) 100%) !important;\n  border-color:\
          \ rgba(99, 102, 241, 0.62) !important;\n  box-shadow:\n    0 18px 44px -18px rgba(99, 102, 241, 0.60),\n    inset 0 1px 0 rgba(255,\
          \ 255, 255, 0.10) !important;\n  --card-primary-color: #FFFFFF;\n  --card-secondary-color: rgba(255, 255, 255, 0.78);\n}\nmushroom-shape-icon\
          \ {\n  --icon-color: #FFFFFF !important;\n  --shape-color: rgba(99, 102, 241, 0.42) !important;\n}\n{% else %}\nmushroom-shape-icon\
          \ {\n  --icon-color: rgba(99, 102, 241, 0.80) !important;\n  --shape-color: rgba(99, 102, 241, 0.13) !important;\n}\n{% endif %}\nha-card:active\
          \ { transform: scale(0.962); }\n"
      grid_options:
        columns: 6
    - type: custom:mushroom-template-card
      icon: mdi:movie-open
      primary: Film
      secondary: Masa %10 mor
      tap_action:
        action: perform-action
        perform_action: script.turn_on
        target:
          entity_id: script.metehantech_movie
      card_mod:
        style: "{%- set g = states.light.tum_isiklar -%}\n{%- set m = states.light.masa_ambiyans -%}\n{%- set gon = g is not none and g.state\
          \ == 'on' -%}\n{%- set mon = m is not none and m.state == 'on' -%}\n{%- set gb = (g.attributes.brightness | default(0) | float(0) /\
          \ 2.55) if gon else -1 -%}\n{%- set mb = (m.attributes.brightness | default(0) | float(0) / 2.55) if mon else -1 -%}\n{%- set gk = (g.attributes.color_temp_kelvin\
