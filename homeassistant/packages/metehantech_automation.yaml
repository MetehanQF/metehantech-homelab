          continue_on_error: true
          data:
            entity: light.oda_4
            operation: white
            brightness: 70
            kelvin: 3000
        - action: script.metehantech_managed_light
          continue_on_error: true
          data:
            entity: light.masa_ambiyans
            operation: white
            brightness: 30
            kelvin: 3000
      - conditions:
        - condition: state
          entity_id: input_select.metehantech_mode
          state: AWAY
        sequence:
