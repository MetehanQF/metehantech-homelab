      continue_on_error: true
      data:
        entity: light.masa_ambiyans
        operation: 'off'
        brightness: 0
        kelvin: 3000
    mode: restart
  metehantech_previous_mode:
    alias: Önceki moda dön
    sequence:
    - action: input_select.select_option
      data:
        option: '{% set p=states(''input_select.metehantech_previous_mode'') %}{{ p if p in [''HOME'',''NIGHT'',''WORK'',''GUEST''] or (is_state(''input_select.metehantech_mode'',''CLEANING'')
          and p in [''AWAY'',''SLEEP'',''MOVIE'',''GAMING'']) else (''NIGHT'' if now().hour >= 23 or now().hour < 7 else ''HOME'') }}'
      target:
        entity_id: input_select.metehantech_mode
    mode: restart
  metehantech_alert:
    alias: MetehanTech merkezi bildirim
    sequence:
    - variables:
        notice_entity: '{{ ''input_text.mt_notice_'' ~ source.split(''.'',1)[1] if source in [''sensor.mt_pi5_temperature_alert'', ''sensor.mt_pi5_disk_alert'',
          ''sensor.mt_pi5_ram_alert'', ''sensor.mt_pi5_cpu_alert'', ''sensor.mt_pi5_online_alert'', ''sensor.mt_pi5_stale_alert'', ''sensor.mt_pcold_temperature_alert'',
          ''sensor.mt_pcold_disk_alert'', ''sensor.mt_pcold_ram_alert'', ''sensor.mt_pcold_cpu_alert'', ''sensor.mt_pcold_online_alert'', ''sensor.mt_pcold_stale_alert'',
          ''sensor.mt_throttled_alert'', ''sensor.mt_smart_alert'', ''sensor.mt_pi5_docker_alert'', ''sensor.mt_pcold_docker_alert'', ''sensor.mt_cloudflare_alert'',
          ''sensor.mt_tailscale_alert'', ''sensor.mt_portainer_alert'', ''sensor.mt_nextcloud_alert'', ''sensor.mt_bridge_alert'', ''sensor.mt_frigate_alert'',
          ''sensor.mt_camera_alert'', ''sensor.mt_detection_alert'', ''sensor.mt_recording_alert'', ''sensor.mt_ffmpeg_alert'', ''sensor.mt_snapshot_alert'',
          ''sensor.mt_container_alert'', ''sensor.mt_backup_pi_alert'', ''sensor.mt_backup_pcold_alert'', ''sensor.mt_backup_cloud_alert'', ''sensor.mt_backup_request_alert'',
          ''sensor.mt_camera_policy_alert''] else '''' }}'
    - condition: template
      value_template: '{{ not notice_entity or states(notice_entity) != (severity if severity in [''WARNING'',''CRITICAL''] else ''OK'') }}'
    - action: logbook.log
      data:
        name: MetehanTech {{ severity }}
        message: '{{ message }}'
        entity_id: '{{ source | default("sensor.mt_active_alerts") }}'
    - event: metehantech_alert
      event_data:
        severity: '{{ severity }}'
        source: '{{ source | default("system") }}'
        message: '{{ message }}'
        recovery: '{{ recovery | default(false) }}'
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ severity in [''WARNING'',''CRITICAL''] }}'
        sequence:
        - action: persistent_notification.create
          data:
            notification_id: mt_{{ source | replace(".","_") }}
            title: MetehanTech · {{ severity }}
            message: '{{ message }}'
        - if:
          - condition: template
            value_template: '{{ severity == ''CRITICAL'' or not is_state(''input_select.metehantech_mode'',''MOVIE'') }}'
          then:
          - action: notify.mobile_app_ana_cihaz_a72
            data:
              title: MetehanTech · {{ severity }}
              message: '{{ message }}'
              data:
                tag: mt_{{ source }}
                group: metehantech-system
                channel: MetehanTech Sistem
                priority: '{{ ''high'' if severity == ''CRITICAL'' else ''normal'' }}'
      default:
      - action: persistent_notification.dismiss
        data:
          notification_id: mt_{{ source | replace(".","_") }}
    - if:
      - condition: template
        value_template: '{{ notice_entity != '''' }}'
      then:
      - action: input_text.set_value
        data:
          value: '{{ severity if severity in [''WARNING'',''CRITICAL''] else ''OK'' }}'
        target:
          entity_id: '{{ notice_entity }}'
    mode: queued
    max: 50
  metehantech_ambient:
    alias: 'İç kullanım: saat uyumlu ışık'
    sequence:
    - repeat:
        for_each: &id003
        - light.odam_lamba
        - light.oda_2
        - light.oda_3
        - light.oda_4
        sequence:
        - if:
          - condition: template
            value_template: '{{ is_state(''input_boolean.metehantech_manual_'' ~ repeat.item.split(''.'')[1],''off'') and (turn_on | default(false)
              or is_state(repeat.item,''on'')) }}'
          then:
          - action: script.metehantech_managed_light
            continue_on_error: true
            data:
              entity: '{{ repeat.item }}'
              operation: white
              brightness: '{{ (25 if now().hour >= 23 or now().hour < 7 else 65) if turn_on | default(false) else ((state_attr(repeat.item,''brightness'')
                | int(166))*100/255) | round(0) }}'
              kelvin: '{{ 2700 if now().hour >= 23 or now().hour < 7 else (3200 if now().hour >= 21 else 4000) }}'
          - if:
            - condition: template
              value_template: '{{ turn_on | default(false) }}'
            then:
            - action: input_boolean.turn_on
              target:
                entity_id: '{{ ''input_boolean.metehantech_owned_'' ~ repeat.item.split(''.'')[1] }}'
    mode: restart
  metehantech_backup_pi:
    alias: Şimdi Yedekle · Pi5 → PcOld
    sequence:
    - condition: template
      value_template: '{{ is_state(''binary_sensor.pcold_online'',''on'') and (state_attr(''sensor.mt_runtime'',''backup_active'') or []) | length
        == 0 and as_timestamp(now())-(states(''sensor.mt_runtime'') | float(0)) < 120 }}'
    - action: shell_command.metehantech_backup_pi
      response_variable: request
    - action: logbook.log
      data:
        name: Backup isteği
        message: '{{ ''İstek kuyruğa alındı; çalıştırma öncesi disk ve kilit kontrolü yapılacak.'' if request.returncode == 0 else ''İstek oluşturulamadı
          veya zaten bekliyor.'' }}'
    mode: restart
  metehantech_backup_pcold:
    alias: Şimdi Yedekle · PcOld → Pi5
    sequence:
    - condition: template
      value_template: '{{ is_state(''binary_sensor.pcold_online'',''on'') and (state_attr(''sensor.mt_runtime'',''backup_active'') or []) | length
        == 0 and as_timestamp(now())-(states(''sensor.mt_runtime'') | float(0)) < 120 }}'
    - action: shell_command.metehantech_backup_pcold
      response_variable: request
    - action: logbook.log
      data:
        name: Backup isteği
        message: '{{ ''İstek kuyruğa alındı; çalıştırma öncesi disk ve kilit kontrolü yapılacak.'' if request.returncode == 0 else ''İstek oluşturulamadı
          veya zaten bekliyor.'' }}'
    mode: restart
  metehantech_camera_presence:
    alias: Kamera · telefon konumuna göre aç/kapat
    sequence:
    - choose:
      - conditions:
        - condition: state
          entity_id: device_tracker.ana_cihaz_a72
          state: home
        sequence:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.metehantech_camera_away
        - if:
          - condition: template
            value_template: '{% set f=state_attr(''sensor.mt_runtime'',''frigate'') %}{% set en=(f.enabled if f is mapping and f.enabled is defined
              else none) %}{{ en is not none and en }}'
          then:
          - action: mqtt.publish
            data:
              topic: frigate/tapo_c211/enabled/set
              payload: 'OFF'
              retain: false
          - action: logbook.log
            data:
              name: Kamera gizliliği
              message: 'Telefon evde: Frigate kamera işleme ve kayıt kapatıldı.'
              entity_id: camera.tapo_c211
      - conditions:
        - condition: template
          value_template: '{{ states(''device_tracker.ana_cihaz_a72'') not in [''home'',''unknown'',''unavailable'',''none'',''''] }}'
        sequence:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.metehantech_camera_away
        - if:
          - condition: template
            value_template: '{% set f=state_attr(''sensor.mt_runtime'',''frigate'') %}{% set en=(f.enabled if f is mapping and f.enabled is defined
              else none) %}{{ en is not none and not en }}'
          then:
          - action: mqtt.publish
            data:
              topic: frigate/tapo_c211/enabled/set
              payload: 'ON'
              retain: false
          - action: logbook.log
            data:
              name: Kamera güvenliği
              message: 'Telefon ev dışında: kamera işlemeye ve kayda başlatıldı.'
              entity_id: camera.tapo_c211
        - repeat:
            for_each:
            - switch.tapo_c211_detect
            - switch.tapo_c211_recordings
            - switch.tapo_c211_snapshots
            sequence:
            - if:
              - condition: template
                value_template: '{{ is_state(repeat.item,''off'') }}'
              then:
              - action: switch.turn_on
                target:
                  entity_id: '{{ repeat.item }}'
    mode: single
    max_exceeded: silent
automation:
- id: metehantech_mode_changed
  alias: MetehanTech Ev · Mod değişimi
  triggers:
  - trigger: state
    entity_id: input_select.metehantech_mode
  conditions:
  - condition: template
    value_template: '{{ trigger.from_state is not none and trigger.to_state is not none and trigger.from_state.state in [''HOME'', ''AWAY'', ''NIGHT'',
      ''SLEEP'', ''WORK'', ''MOVIE'', ''GAMING'', ''GUEST'', ''CLEANING''] and trigger.to_state.state in [''HOME'', ''AWAY'', ''NIGHT'', ''SLEEP'',
      ''WORK'', ''MOVIE'', ''GAMING'', ''GUEST'', ''CLEANING''] and trigger.from_state.state != trigger.to_state.state }}'
  actions:
  - action: input_select.select_option
    data:
      option: '{{ trigger.from_state.state }}'
    target:
      entity_id: input_select.metehantech_previous_mode
  - action: logbook.log
    data:
      name: Ev modu
      message: '{{ trigger.from_state.state }} → {{ trigger.to_state.state }}'
      entity_id: input_select.metehantech_mode
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.to_state.state == ''HOME'' and trigger.to_state.context.user_id is none and trigger.to_state.context.parent_id
          is not none }}'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id:
          - input_boolean.metehantech_manual_odam_lamba
          - input_boolean.metehantech_manual_oda_2
          - input_boolean.metehantech_manual_oda_3
          - input_boolean.metehantech_manual_oda_4
          - input_boolean.metehantech_manual_masa_ambiyans
          - input_boolean.metehantech_owned_odam_lamba
          - input_boolean.metehantech_owned_oda_2
          - input_boolean.metehantech_owned_oda_3
          - input_boolean.metehantech_owned_oda_4
          - input_boolean.metehantech_owned_masa_ambiyans
      - if:
        - condition: state
          entity_id: sun.sun
          state: below_horizon
        then:
        - action: script.metehantech_ambient
          data:
            turn_on: true
    default:
    - action: script.metehantech_apply_mode
  mode: restart
- id: metehantech_sleep_finish
  alias: MetehanTech Işıklar · Uyku kapanışı
  triggers:
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.metehantech_sleep
  conditions:
  - condition: state
    entity_id: input_select.metehantech_mode
    state: SLEEP
  - condition: state
    entity_id: input_boolean.metehantech_pause
    state: 'off'
  - condition: state
    entity_id: input_boolean.metehantech_manual_masa_ambiyans
    state: 'off'
  actions:
  - action: script.metehantech_managed_light
    continue_on_error: true
    data:
      entity: light.masa_ambiyans
      operation: 'off'
      brightness: 0
      kelvin: 3000
  mode: single
  initial_state: false
- id: metehantech_manual_ui
  alias: MetehanTech Işıklar · Manuel HA kontrolünü koru
  triggers:
  - trigger: event
    event_type: call_service
    event_data:
      domain: light
  conditions:
  - condition: template
    value_template: '{{ trigger.event.context.user_id is not none and trigger.event.context.parent_id is none and not (is_state(''script.metehantech_managed_light'',''on'')
      and trigger.event.context.id == states.script.metehantech_managed_light.context.id) and trigger.event.data.service in [''turn_on'',''turn_off'',''toggle'']
      }}'
  actions:
  - variables:
      targets: '{{ trigger.event.data.service_data.entity_id | default([]) }}'
  - repeat:
      for_each: &id002
      - light.odam_lamba
      - light.oda_2
      - light.oda_3
      - light.oda_4
      - light.masa_ambiyans
      sequence:
      - if:
        - condition: template
          value_template: '{{ repeat.item in targets or ''light.tum_isiklar'' in targets or targets == ''all'' or trigger.event.data.service_data.area_id
            is defined or trigger.event.data.service_data.device_id is defined or trigger.event.data.service_data.label_id is defined }}'
        then:
        - action: input_boolean.turn_on
          target:
            entity_id: '{{ ''input_boolean.metehantech_manual_'' ~ repeat.item.split(''.'')[1] }}'
        - action: input_boolean.turn_off
          target:
            entity_id: '{{ ''input_boolean.metehantech_owned_'' ~ repeat.item.split(''.'')[1] }}'
  mode: queued
- id: metehantech_manual_physical
  alias: MetehanTech Işıklar · Harici manuel değişimi koru
  triggers:
  - trigger: state
    entity_id: *id002
  conditions:
  - condition: template
    value_template: '{{ trigger.from_state is not none and trigger.to_state is not none and trigger.from_state.state in [''on'',''off''] and trigger.to_state.state
      in [''on'',''off''] and trigger.to_state.context.parent_id is none and (as_timestamp(now()) - as_timestamp(states(''input_datetime.metehantech_auto_''
      ~ trigger.entity_id.split(''.'')[1]),0)) > 15 and (trigger.from_state.state != trigger.to_state.state or trigger.from_state.attributes.get(''brightness'')
      != trigger.to_state.attributes.get(''brightness'') or trigger.from_state.attributes.get(''color_temp_kelvin'') != trigger.to_state.attributes.get(''color_temp_kelvin'')
      or trigger.from_state.attributes.get(''hs_color'') != trigger.to_state.attributes.get(''hs_color'')) }}'
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: '{{ ''input_boolean.metehantech_manual_'' ~ trigger.entity_id.split(''.'')[1] }}'
  - action: input_boolean.turn_off
    target:
      entity_id: '{{ ''input_boolean.metehantech_owned_'' ~ trigger.entity_id.split(''.'')[1] }}'
  mode: queued
- id: metehantech_startup_preserve
  alias: MetehanTech Işıklar · Başlangıçta manuel ayarı koru
  triggers:
  - trigger: homeassistant
    event: start
  conditions: []
  actions:
  - delay: 00:00:20
  - repeat:
      for_each: *id002
      sequence:
      - if:
        - condition: template
          value_template: '{{ is_state(repeat.item,''on'') }}'
        then:
        - action: input_boolean.turn_on
          target:
            entity_id: '{{ ''input_boolean.metehantech_manual_'' ~ repeat.item.split(''.'')[1] }}'
  mode: single
- id: metehantech_sunset
  alias: MetehanTech Işıklar · Gün batımı
  triggers:
  - trigger: sun
    event: sunset
  conditions:
  - condition: state
    entity_id: input_select.metehantech_mode
    state: HOME
  - condition: state
    entity_id: input_boolean.metehantech_pause
    state: 'off'
  actions:
  - action: script.metehantech_ambient
    data:
      turn_on: true
  mode: single
- id: metehantech_warm_evening
  alias: MetehanTech Işıklar · Akşam renk sıcaklığı
  triggers:
  - trigger: time
    at: '19:00:00'
  - trigger: time
    at: '21:00:00'
  - trigger: time
    at: '23:00:00'
  conditions:
  - condition: template
    value_template: '{{ states(''input_select.metehantech_mode'') in [''HOME'',''WORK''] }}'
  - condition: state
    entity_id: input_boolean.metehantech_pause
    state: 'off'
  actions:
  - action: script.metehantech_ambient
    data:
      turn_on: false
  mode: single
- id: metehantech_sunrise
  alias: MetehanTech Işıklar · Sadece otomatik akşam ışığını kapat
  triggers:
  - trigger: sun
    event: sunrise
  conditions:
  - condition: state
    entity_id: input_select.metehantech_mode
    state: HOME
  - condition: state
    entity_id: input_boolean.metehantech_pause
    state: 'off'
  actions:
  - repeat:
      for_each: *id003
      sequence:
      - if:
        - condition: template
          value_template: '{{ is_state(''input_boolean.metehantech_owned_'' ~ repeat.item.split(''.'')[1],''on'') and is_state(''input_boolean.metehantech_manual_''
            ~ repeat.item.split(''.'')[1],''off'') }}'
        then:
        - action: script.metehantech_managed_light
          continue_on_error: true
          data:
            entity: '{{ repeat.item }}'
            operation: 'off'
            brightness: 0
            kelvin: 3000
        - action: input_boolean.turn_off
          target:
            entity_id: '{{ ''input_boolean.metehantech_owned_'' ~ repeat.item.split(''.'')[1] }}'
  mode: single
- id: metehantech_night_defaults
  alias: MetehanTech Işıklar · 02–07 fiziksel açılış
  triggers:
  - trigger: state
    entity_id: *id002
    from: 'off'
    to: 'on'
  conditions:
  - condition: state
    entity_id: input_boolean.metehantech_pause
    state: 'off'
  - condition: template
    value_template: '{{ 2 <= now().hour < 7 and states(''input_select.metehantech_mode'') in [''HOME'',''NIGHT'',''SLEEP''] and trigger.to_state.context.user_id
      is none and trigger.to_state.context.parent_id is none and is_state(''input_boolean.metehantech_manual_'' ~ trigger.entity_id.split(''.'')[1],''off'')
      and as_timestamp(now())-as_timestamp(states(''input_datetime.metehantech_auto_'' ~ trigger.entity_id.split(''.'')[1]),0)>15 }}'
  actions:
  - action: script.metehantech_managed_light
    continue_on_error: true
    data:
      entity: '{{ trigger.entity_id }}'
      operation: white
      brightness: 20
      kelvin: 2700
  - action: input_boolean.turn_on
    target:
      entity_id: '{{ ''input_boolean.metehantech_manual_'' ~ trigger.entity_id.split(''.'')[1] }}'
  mode: single
  initial_state: false
- id: metehantech_away_stray
  alias: MetehanTech Işıklar · AWAY açık kalan ışık
  triggers:
  - trigger: state
    entity_id: *id002
    to: 'on'
    for: 00:03:00
  conditions:
  - condition: state
    entity_id: input_select.metehantech_mode
    state: AWAY
  - condition: state
    entity_id: input_boolean.metehantech_pause
    state: 'off'
  - condition: template
    value_template: '{{ is_state(''input_boolean.metehantech_manual_'' ~ trigger.entity_id.split(''.'')[1],''off'') }}'
  actions:
  - action: script.metehantech_managed_light
    continue_on_error: true
    data:
      entity: '{{ trigger.entity_id }}'
      operation: 'off'
      brightness: 0
      kelvin: 3000
  mode: single
- id: metehantech_presence
  alias: MetehanTech Ev · Güvenilir presence ile HOME AWAY
  triggers:
  - trigger: state
    entity_id: person.metehan
    to: home
    for: 00:02:00
    id: home
  - trigger: state
    entity_id: person.metehan
    to: not_home
    for: 00:10:00
    id: away
  conditions:
  - condition: state
    entity_id: input_boolean.metehantech_presence_enabled
    state: 'on'
  - condition: state
    entity_id: input_boolean.metehantech_pause
    state: 'off'
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''away'' and states(''input_select.metehantech_mode'') in [''HOME'',''NIGHT''] }}'
      sequence:
      - action: script.metehantech_away
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''home'' and is_state(''input_select.metehantech_mode'',''AWAY'') }}'
      sequence:
      - action: input_select.select_option
        data:
          option: HOME
        target:
          entity_id: input_select.metehantech_mode
  mode: single
- id: metehantech_work_break
  alias: MetehanTech Ev · İsteğe bağlı çalışma molası
  triggers:
  - trigger: state
    entity_id: input_select.metehantech_mode
    to: WORK
    for: 01:00:00
  conditions:
  - condition: state
    entity_id: input_boolean.metehantech_break_enabled
    state: 'on'
  - condition: state
    entity_id: input_boolean.metehantech_pause
    state: 'off'
  actions:
  - action: script.metehantech_alert
    data:
      source: input_select.metehantech_mode
      severity: INFO
      message: Bir saattir WORK modundasın; kısa bir mola verebilirsin.
  mode: single
- id: metehantech_backup_lifecycle
  alias: MetehanTech Backup · Sonuç ve recovery günlüğü
  triggers:
  - trigger: state
    entity_id: sensor.mt_runtime
    attribute: backups
  conditions:
  - condition: template
    value_template: '{{ trigger.from_state is not none and trigger.to_state is not none }}'
  actions:
  - repeat:
      for_each:
      - pi
      - pcold
      - cloud
      sequence:
      - variables:
          new: '{{ (trigger.to_state.attributes.backups or {}).get(repeat.item,{}) }}'
          old: '{{ (trigger.from_state.attributes.backups | default({})).get(repeat.item,{}) }}'
      - if:
        - condition: template
          value_template: '{{ new.get(''status'') in [''success'',''running'',''failed'',''verification_failed''] and (new.get(''status'') !=
            old.get(''status'') or new.get(''finished_at'') != old.get(''finished_at'')) }}'
        then:
        - action: logbook.log
          data:
            name: Backup · {{ repeat.item }}
            message: '{{ new.get(''status'') }} · {{ new.get(''phase'','''') }}'
            entity_id: sensor.mt_runtime
        - event: metehantech_alert
          event_data:
            severity: '{{ ''WARNING'' if new.get(''status'') in [''failed'',''verification_failed''] else ''INFO'' }}'
            source: sensor.mt_runtime
            message: 'Backup {{ repeat.item }}: {{ new.get(''status'') }}'
            recovery: '{{ new.get(''status'') == ''success'' }}'
  mode: queued
- id: metehantech_camera_presence
  alias: MetehanTech Güvenlik · Evde kapalı / dışarıda aktif
  triggers:
  - trigger: state
    entity_id:
    - device_tracker.ana_cihaz_a72
    - sensor.mt_runtime
    to: null
  - trigger: homeassistant
    event: start
  - trigger: mqtt
    topic: frigate/available
    payload: online
  - trigger: time_pattern
    minutes: /1
  conditions: []
  actions:
  - action: script.metehantech_camera_presence
  mode: single
  max_exceeded: silent
- id: metehantech_health_notifications
  alias: MetehanTech Sistem · Sorun / yükselme / recovery
  triggers:
  - trigger: state
    entity_id: &id004
    - sensor.mt_pi5_temperature_alert
    - sensor.mt_pi5_disk_alert
    - sensor.mt_pi5_ram_alert
    - sensor.mt_pi5_cpu_alert
    - sensor.mt_pi5_online_alert
    - sensor.mt_pi5_stale_alert
    - sensor.mt_pcold_temperature_alert
    - sensor.mt_pcold_disk_alert
    - sensor.mt_pcold_ram_alert
    - sensor.mt_pcold_cpu_alert
    - sensor.mt_pcold_online_alert
    - sensor.mt_pcold_stale_alert
    - sensor.mt_throttled_alert
    - sensor.mt_smart_alert
    - sensor.mt_pi5_docker_alert
    - sensor.mt_pcold_docker_alert
    - sensor.mt_cloudflare_alert
    - sensor.mt_tailscale_alert
    - sensor.mt_portainer_alert
    - sensor.mt_nextcloud_alert
    - sensor.mt_bridge_alert
    - sensor.mt_frigate_alert
    - sensor.mt_camera_alert
    - sensor.mt_detection_alert
    - sensor.mt_recording_alert
    - sensor.mt_ffmpeg_alert
    - sensor.mt_snapshot_alert
    - sensor.mt_container_alert
    - sensor.mt_backup_pi_alert
    - sensor.mt_backup_pcold_alert
    - sensor.mt_backup_cloud_alert
    - sensor.mt_backup_request_alert
    - sensor.mt_camera_policy_alert
    for: 00:01:00
  conditions:
  - condition: template
    value_template: '{{ trigger.to_state is not none and trigger.from_state is not none and trigger.to_state.state != trigger.from_state.state
      and (trigger.to_state.state in [''WARNING'',''CRITICAL''] or (trigger.to_state.state in [''OK'',''PAUSED''] and trigger.from_state.state
      in [''WARNING'',''CRITICAL''])) }}'
  actions:
  - variables:
      source: '{{ trigger.entity_id }}'
      label: '{{ trigger.to_state.attributes.friendly_label | default(trigger.entity_id) }}'
  - action: script.metehantech_alert
    data:
      source: '{{ source }}'
      severity: '{{ trigger.to_state.state if trigger.to_state.state in [''WARNING'',''CRITICAL''] else ''INFO'' }}'
      message: '{{ label }}: {{ trigger.to_state.state }}{{ '' · düzeldi / bilinçli kapalı'' if trigger.to_state.state in [''OK'',''PAUSED'']
        else '''' }}'
      recovery: '{{ trigger.to_state.state in [''OK'',''PAUSED''] }}'
  mode: queued
  max: 50
- id: metehantech_health_startup
  alias: MetehanTech Sistem · Başlangıç sağlık kontrolü
  triggers:
  - trigger: homeassistant
    event: start
  conditions: []
  actions:
  - delay: 00:02:00
  - repeat:
      for_each: *id004
      sequence:
      - if:
        - condition: template
          value_template: '{{ states(repeat.item) in [''WARNING'',''CRITICAL''] }}'
        then:
        - action: script.metehantech_alert
          data:
            source: '{{ repeat.item }}'
            severity: '{{ states(repeat.item) }}'
            message: '{{ state_attr(repeat.item,''friendly_label'') }}: {{ states(repeat.item) }} (başlangıç kontrolü)'
  mode: single
- id: metehantech_weather_morning
  alias: MetehanTech Ev · Sabah yağmur bilgisi
  triggers:
  - trigger: time
    at: 07:30:00
  conditions:
  - condition: state
    entity_id: input_boolean.metehantech_pause
    state: 'off'
  actions:
  - action: weather.get_forecasts
    response_variable: forecast
    data:
      type: hourly
    target:
      entity_id: weather.forecast_home
  - variables:
      rain: '{{ forecast.get(''weather.forecast_home'',{}).get(''forecast'',[])[:6] | selectattr(''condition'',''in'',[''rainy'',''pouring'',''lightning-rainy''])
        | list | length > 0 }}'
  - if:
    - condition: template
      value_template: '{{ rain }}'
    then:
    - action: script.metehantech_alert
      data:
        source: weather.forecast_home
        severity: INFO
        message: Önümüzdeki 6 saatte yağmur bekleniyor.
  mode: single
- id: metehantech_weather_severe
  alias: MetehanTech Ev · Şiddetli hava dashboard uyarısı
  triggers:
  - trigger: state
    entity_id: weather.forecast_home
    to: exceptional
    for: 00:05:00
  - trigger: state
    entity_id: weather.forecast_home
    to: hail
    for: 00:05:00
  - trigger: state
    entity_id: weather.forecast_home
    to: lightning-rainy
    for: 00:05:00
  - trigger: state
    entity_id: weather.forecast_home
    to: pouring
    for: 00:05:00
  conditions:
  - condition: state
    entity_id: input_boolean.metehantech_pause
    state: 'off'
  actions:
  - action: script.metehantech_alert
    data:
      source: weather.forecast_home
      severity: INFO
      message: 'Şiddetli hava koşulu: {{ states("weather.forecast_home") }}. Hava kartını kontrol et.'
  mode: single
- id: metehantech_weather_uv
  alias: MetehanTech Ev · Yüksek UV dashboard bilgisi
  triggers:
  - trigger: time
    at: '10:00:00'
  - trigger: time
    at: '13:00:00'
  conditions:
  - condition: state
    entity_id: input_boolean.metehantech_pause
    state: 'off'
  - condition: template
    value_template: '{{ state_attr(''weather.forecast_home'',''uv_index'') is number and state_attr(''weather.forecast_home'',''uv_index'') >=
      6 }}'
  actions:
  - action: script.metehantech_alert
    data:
      source: weather.forecast_home
      severity: INFO
      message: 'UV indeksi yüksek: {{ state_attr(''weather.forecast_home'',''uv_index'') }}'
  mode: single
template:
- sensor:
  - name: MT Pi5 Temperature Alert
    unique_id: mt_pi5_temperature_alert
    state: '{% set v=states(''sensor.pi5_temperature'') %}{{ ''UNKNOWN'' if not is_number(v) else (''CRITICAL'' if v|float >= 82 else (''WARNING''
      if v|float >= 75 else ''OK'')) }}'
    attributes:
      friendly_label: Pi5 sıcaklık
- sensor:
  - name: MT Pi5 Disk Alert
    unique_id: mt_pi5_disk_alert
    state: '{% set v=states(''sensor.pi5_disk'') %}{{ ''UNKNOWN'' if not is_number(v) else (''CRITICAL'' if v|float >= 95 else (''WARNING'' if
      v|float >= 85 else ''OK'')) }}'
    attributes:
      friendly_label: Pi5 disk
- sensor:
  - name: MT Pi5 Ram Alert
    unique_id: mt_pi5_ram_alert
    state: '{% set v=states(''sensor.pi5_ram'') %}{{ ''UNKNOWN'' if not is_number(v) else (''CRITICAL'' if v|float >= 101 else (''WARNING'' if
      v|float >= 90 else ''OK'')) }}'
    attributes:
      friendly_label: Pi5 RAM
- binary_sensor:
  - name: MT pi5 CPU Sustained
    unique_id: mt_pi5_cpu_sustained
    state: '{{ states(''sensor.pi5_cpu'') | float(0) > 90 }}'
    availability: '{{ is_number(states(''sensor.pi5_cpu'')) }}'
    delay_on: 00:05:00
- sensor:
  - name: MT Pi5 Cpu Alert
    unique_id: mt_pi5_cpu_alert
    state: '{{ ''UNKNOWN'' if states(''binary_sensor.mt_pi5_cpu_sustained'') not in [''on'',''off''] else (''WARNING'' if is_state(''binary_sensor.mt_pi5_cpu_sustained'',''on'')
      else ''OK'') }}'
    attributes:
      friendly_label: Pi5 CPU 5 dakika >%90
- sensor:
  - name: MT Pi5 Online Alert
    unique_id: mt_pi5_online_alert
    state: '{{ ''OK'' if is_state(''binary_sensor.pi5_online'',''on'') else ''WARNING'' }}'
    attributes:
      friendly_label: Pi5 çevrimdışı
- sensor:
  - name: MT Pi5 Stale Alert
    unique_id: mt_pi5_stale_alert
    state: '{% set t=(state_attr(''sensor.mt_runtime'',''metrics_time'') or {}).get(''pi5'') %}{% set age=as_timestamp(now())-(t|float(0)) %}{{
      ''UNKNOWN'' if not t else (''CRITICAL'' if age>300 else (''WARNING'' if age>120 else ''OK'')) }}'
    attributes:
      friendly_label: Pi5 metrik güncelliği
- sensor:
  - name: MT Pcold Temperature Alert
