    state: '{{ ''UNKNOWN'' if states(''binary_sensor.pi5_throttled'') not in [''on'',''off''] else (''CRITICAL'' if is_state(''binary_sensor.pi5_throttled'',''on'')
      else ''OK'') }}'
    attributes:
      friendly_label: Pi5 throttling
- sensor:
  - name: MT Smart Alert
    unique_id: mt_smart_alert
    state: '{{ ''UNKNOWN'' if states(''binary_sensor.pcold_smart'') not in [''on'',''off''] else (''CRITICAL'' if is_state(''binary_sensor.pcold_smart'',''on'')
      else ''OK'') }}'
    attributes:
      friendly_label: PcOld SMART
- sensor:
  - name: MT Pi5 Docker Alert
    unique_id: mt_pi5_docker_alert
    state: '{{ ''UNKNOWN'' if states(''binary_sensor.pi5_docker'') not in [''on'',''off''] else (''WARNING'' if is_state(''binary_sensor.pi5_docker'',''off'')
      else ''OK'') }}'
    attributes:
      friendly_label: Pi5 Docker
- sensor:
  - name: MT Pcold Docker Alert
    unique_id: mt_pcold_docker_alert
    state: '{{ ''UNKNOWN'' if states(''binary_sensor.pcold_docker'') not in [''on'',''off''] else (''WARNING'' if is_state(''binary_sensor.pcold_docker'',''off'')
      else ''OK'') }}'
    attributes:
      friendly_label: PcOld Docker
- sensor:
  - name: MT Cloudflare Alert
    unique_id: mt_cloudflare_alert
    state: '{{ ''UNKNOWN'' if states(''binary_sensor.pi5_cloudflared'') not in [''on'',''off''] else (''WARNING'' if is_state(''binary_sensor.pi5_cloudflared'',''off'')
      else ''OK'') }}'
    attributes:
      friendly_label: Cloudflare
- sensor:
  - name: MT Tailscale Alert
    unique_id: mt_tailscale_alert
    state: '{{ ''UNKNOWN'' if states(''binary_sensor.pi5_tailscale'') not in [''on'',''off''] else (''WARNING'' if is_state(''binary_sensor.pi5_tailscale'',''off'')
      else ''OK'') }}'
    attributes:
      friendly_label: Tailscale
- sensor:
  - name: MT Portainer Alert
    unique_id: mt_portainer_alert
    state: '{{ ''UNKNOWN'' if states(''binary_sensor.pcold_portainer'') not in [''on'',''off''] else (''WARNING'' if is_state(''binary_sensor.pcold_portainer'',''off'')
      else ''OK'') }}'
    attributes:
      friendly_label: PcOld Portainer
- sensor:
  - name: MT Nextcloud Alert
    unique_id: mt_nextcloud_alert
    state: '{{ ''OK'' if is_state(''sensor.pi5_nextcloud'',''OK'') else ''WARNING'' }}'
    attributes:
      friendly_label: Nextcloud
- sensor:
  - name: MT Bridge Alert
    unique_id: mt_bridge_alert
    state: '{% set age=as_timestamp(now())-states(''sensor.mt_runtime'')|float(0) %}{{ ''CRITICAL'' if age>300 else (''WARNING'' if age>120 or
      (state_attr(''sensor.mt_runtime'',''errors'') or [])|length > 0 else ''OK'') }}'
    attributes:
      friendly_label: Yerel metrik bağlantısı
- sensor:
  - name: MT Frigate Alert
    unique_id: mt_frigate_alert
    state: '{{ ''OK'' if is_state(''sensor.frigate_status'',''running'') else ''WARNING'' }}'
    attributes:
      friendly_label: Frigate süreç
- sensor:
  - name: MT Camera Alert
    unique_id: mt_camera_alert
    state: '{% set f=state_attr(''sensor.mt_runtime'',''frigate'') %}{% set en=(f.enabled if f is mapping and f.enabled is defined else none)
      %}{% if en is not none and not en and is_state(''input_boolean.metehantech_camera_away'',''off'') %}PAUSED{% else %}{% set f=state_attr(''sensor.mt_runtime'',''frigate'')
      or {} %}{{ ''UNKNOWN'' if f.get(''camera_fps'') is none else (''OK'' if f.camera_fps|float>0 else ''WARNING'') }}{% endif %}'
    attributes:
      friendly_label: Kamera akışı
- sensor:
  - name: MT Detection Alert
    unique_id: mt_detection_alert
    state: '{% set f=state_attr(''sensor.mt_runtime'',''frigate'') %}{% set en=(f.enabled if f is mapping and f.enabled is defined else none)
      %}{% if en is not none and not en and is_state(''input_boolean.metehantech_camera_away'',''off'') %}PAUSED{% else %}{% set f=state_attr(''sensor.mt_runtime'',''frigate'')
      or {} %}{{ ''UNKNOWN'' if not f else (''OK'' if f.get(''detection_enabled'') and f.get(''detector_pid'') and f.get(''process_fps'',0)|float>0
      and is_state(''switch.tapo_c211_detect'',''on'') else ''WARNING'') }}{% endif %}'
    attributes:
      friendly_label: Frigate detection
- sensor:
  - name: MT Recording Alert
    unique_id: mt_recording_alert
    state: '{% set f=state_attr(''sensor.mt_runtime'',''frigate'') %}{% set en=(f.enabled if f is mapping and f.enabled is defined else none)
      %}{% if en is not none and not en and is_state(''input_boolean.metehantech_camera_away'',''off'') %}PAUSED{% else %}{% set f=state_attr(''sensor.mt_runtime'',''frigate'')
      or {} %}{{ ''UNKNOWN'' if f.get(''recording_age'') is none or (not f.get(''recording_observed'',true) and f.recording_age|float<=120) else
      (''CRITICAL'' if f.recording_age|float>300 else (''WARNING'' if f.recording_age|float>120 or not is_state(''switch.tapo_c211_recordings'',''on'')
      else ''OK'')) }}{% endif %}'
    attributes:
      friendly_label: Frigate kayıt ilerlemesi
- sensor:
  - name: MT Ffmpeg Alert
    unique_id: mt_ffmpeg_alert
    state: '{% set f=state_attr(''sensor.mt_runtime'',''frigate'') %}{% set en=(f.enabled if f is mapping and f.enabled is defined else none)
      %}{% if en is not none and not en and is_state(''input_boolean.metehantech_camera_away'',''off'') %}PAUSED{% else %}{% set f=state_attr(''sensor.mt_runtime'',''frigate'')
      or {} %}{{ ''UNKNOWN'' if not f else (''CRITICAL'' if f.get(''ffmpeg_changes_10m'',0)|int>=3 else (''WARNING'' if not f.get(''ffmpeg_pid'')
      else ''OK'')) }}{% endif %}'
    attributes:
      friendly_label: FFmpeg 10 dakika süreç değişimleri
- sensor:
  - name: MT Snapshot Alert
    unique_id: mt_snapshot_alert
    state: '{% set f=state_attr(''sensor.mt_runtime'',''frigate'') %}{% set en=(f.enabled if f is mapping and f.enabled is defined else none)
      %}{% if en is not none and not en and is_state(''input_boolean.metehantech_camera_away'',''off'') %}PAUSED{% else %}{% set f=state_attr(''sensor.mt_runtime'',''frigate'')
      or {} %}{{ ''UNKNOWN'' if not f else (''WARNING'' if f.get(''snapshots_missing'') or not is_state(''switch.tapo_c211_snapshots'',''on'')
      else ''OK'') }}{% endif %}'
    attributes:
      friendly_label: Frigate snapshot üretimi
- sensor:
  - name: MT Container Alert
    unique_id: mt_container_alert
    state: '{% set rows=state_attr(''sensor.mt_runtime'',''containers'') or {} %}{% set ns=namespace(bad=false) %}{% for v in rows.values() %}{%
      if v.state != ''running'' or v.health == ''unhealthy'' %}{% set ns.bad=true %}{% endif %}{% endfor %}{{ ''UNKNOWN'' if not rows else (''CRITICAL''
      if state_attr(''sensor.mt_runtime'',''container_restarts_10m'')|int(0)>=3 else (''WARNING'' if ns.bad else ''OK'')) }}'
    attributes:
      friendly_label: Docker servis sağlığı
- sensor:
  - name: MT Backup Pi Alert
    unique_id: mt_backup_pi_alert
    state: '{% set b=(state_attr(''sensor.mt_runtime'',''backups'') or {}).get(''pi'',{}) %}{% set last=as_timestamp(b.get(''last_success''),none)
      %}{% set age=(as_timestamp(now())-last)/3600 if last is not none else none %}{{ ''UNKNOWN'' if not b else (''CRITICAL'' if age is not none
      and age>=48 else (''WARNING'' if age is none or age>=24 or b.get(''status'') in [''failed'',''verification_failed''] else ''OK'')) }}'
    attributes:
      friendly_label: pi backup
- sensor:
  - name: MT Backup Pcold Alert
    unique_id: mt_backup_pcold_alert
    state: '{% set b=(state_attr(''sensor.mt_runtime'',''backups'') or {}).get(''pcold'',{}) %}{% set last=as_timestamp(b.get(''last_success''),none)
      %}{% set age=(as_timestamp(now())-last)/3600 if last is not none else none %}{{ ''UNKNOWN'' if not b else (''CRITICAL'' if age is not none
      and age>=48 else (''WARNING'' if age is none or age>=24 or b.get(''status'') in [''failed'',''verification_failed''] else ''OK'')) }}'
    attributes:
      friendly_label: pcold backup
- sensor:
  - name: MT Backup Cloud Alert
    unique_id: mt_backup_cloud_alert
    state: '{% set b=(state_attr(''sensor.mt_runtime'',''backups'') or {}).get(''cloud'',{}) %}{% set last=as_timestamp(b.get(''last_success''),none)
      %}{% set age=(as_timestamp(now())-last)/3600 if last is not none else none %}{{ ''UNKNOWN'' if not b else (''CRITICAL'' if age is not none
      and age>=48 else (''WARNING'' if age is none or age>=24 or b.get(''status'') in [''failed'',''verification_failed''] else ''OK'')) }}'
    attributes:
      friendly_label: cloud backup
- sensor:
  - name: MT Backup Request Alert
    unique_id: mt_backup_request_alert
    state: '{% set r=state_attr(''sensor.mt_runtime'',''backup_request'') or {} %}{{ ''WARNING'' if r.get(''status'') == ''blocked'' and as_timestamp(now())-r.get(''at'',0)<3600
      else ''OK'' }}'
    attributes:
      friendly_label: Manuel backup isteği
- sensor:
  - name: MT Camera Policy Alert
    unique_id: mt_camera_policy_alert
    state: '{% set f=state_attr(''sensor.mt_runtime'',''frigate'') %}{% set en=(f.enabled if f is mapping and f.enabled is defined else none)
      %}{% set loc=states(''device_tracker.ana_cihaz_a72'') %}{{ ''WARNING'' if loc in [''unknown'',''unavailable''] or en is none else (''OK''
      if (loc==''home'') != (en | bool) else ''WARNING'') }}'
    attributes:
      friendly_label: Kamera konum kuralı
- sensor:
  - name: MT Active Alerts
    unique_id: mt_active_alerts
    state: '{% set ns=namespace(n=0) %}{% for e in [''sensor.mt_pi5_temperature_alert'', ''sensor.mt_pi5_disk_alert'', ''sensor.mt_pi5_ram_alert'',
      ''sensor.mt_pi5_cpu_alert'', ''sensor.mt_pi5_online_alert'', ''sensor.mt_pi5_stale_alert'', ''sensor.mt_pcold_temperature_alert'', ''sensor.mt_pcold_disk_alert'',
      ''sensor.mt_pcold_ram_alert'', ''sensor.mt_pcold_cpu_alert'', ''sensor.mt_pcold_online_alert'', ''sensor.mt_pcold_stale_alert'', ''sensor.mt_throttled_alert'',
      ''sensor.mt_smart_alert'', ''sensor.mt_pi5_docker_alert'', ''sensor.mt_pcold_docker_alert'', ''sensor.mt_cloudflare_alert'', ''sensor.mt_tailscale_alert'',
      ''sensor.mt_portainer_alert'', ''sensor.mt_nextcloud_alert'', ''sensor.mt_bridge_alert'', ''sensor.mt_frigate_alert'', ''sensor.mt_camera_alert'',
      ''sensor.mt_detection_alert'', ''sensor.mt_recording_alert'', ''sensor.mt_ffmpeg_alert'', ''sensor.mt_snapshot_alert'', ''sensor.mt_container_alert'',
      ''sensor.mt_backup_pi_alert'', ''sensor.mt_backup_pcold_alert'', ''sensor.mt_backup_cloud_alert'', ''sensor.mt_backup_request_alert'', ''sensor.mt_camera_policy_alert'']
      %}{% if states(e) in [''WARNING'',''CRITICAL''] %}{% set ns.n=ns.n+1 %}{% endif %}{% endfor %}{{ ns.n + (state_attr(''sensor.mt_runtime'',''alerts'')
      or [])|length }}'
    attributes:
      entities: '{{ [''sensor.mt_pi5_temperature_alert'', ''sensor.mt_pi5_disk_alert'', ''sensor.mt_pi5_ram_alert'', ''sensor.mt_pi5_cpu_alert'',
        ''sensor.mt_pi5_online_alert'', ''sensor.mt_pi5_stale_alert'', ''sensor.mt_pcold_temperature_alert'', ''sensor.mt_pcold_disk_alert'',
        ''sensor.mt_pcold_ram_alert'', ''sensor.mt_pcold_cpu_alert'', ''sensor.mt_pcold_online_alert'', ''sensor.mt_pcold_stale_alert'', ''sensor.mt_throttled_alert'',
        ''sensor.mt_smart_alert'', ''sensor.mt_pi5_docker_alert'', ''sensor.mt_pcold_docker_alert'', ''sensor.mt_cloudflare_alert'', ''sensor.mt_tailscale_alert'',
        ''sensor.mt_portainer_alert'', ''sensor.mt_nextcloud_alert'', ''sensor.mt_bridge_alert'', ''sensor.mt_frigate_alert'', ''sensor.mt_camera_alert'',
        ''sensor.mt_detection_alert'', ''sensor.mt_recording_alert'', ''sensor.mt_ffmpeg_alert'', ''sensor.mt_snapshot_alert'', ''sensor.mt_container_alert'',
        ''sensor.mt_backup_pi_alert'', ''sensor.mt_backup_pcold_alert'', ''sensor.mt_backup_cloud_alert'', ''sensor.mt_backup_request_alert'',
        ''sensor.mt_camera_policy_alert''] }}'
      unknown_count: '{% set ns=namespace(n=0) %}{% for e in [''sensor.mt_pi5_temperature_alert'', ''sensor.mt_pi5_disk_alert'', ''sensor.mt_pi5_ram_alert'',
        ''sensor.mt_pi5_cpu_alert'', ''sensor.mt_pi5_online_alert'', ''sensor.mt_pi5_stale_alert'', ''sensor.mt_pcold_temperature_alert'', ''sensor.mt_pcold_disk_alert'',
        ''sensor.mt_pcold_ram_alert'', ''sensor.mt_pcold_cpu_alert'', ''sensor.mt_pcold_online_alert'', ''sensor.mt_pcold_stale_alert'', ''sensor.mt_throttled_alert'',
        ''sensor.mt_smart_alert'', ''sensor.mt_pi5_docker_alert'', ''sensor.mt_pcold_docker_alert'', ''sensor.mt_cloudflare_alert'', ''sensor.mt_tailscale_alert'',
        ''sensor.mt_portainer_alert'', ''sensor.mt_nextcloud_alert'', ''sensor.mt_bridge_alert'', ''sensor.mt_frigate_alert'', ''sensor.mt_camera_alert'',
        ''sensor.mt_detection_alert'', ''sensor.mt_recording_alert'', ''sensor.mt_ffmpeg_alert'', ''sensor.mt_snapshot_alert'', ''sensor.mt_container_alert'',
        ''sensor.mt_backup_pi_alert'', ''sensor.mt_backup_pcold_alert'', ''sensor.mt_backup_cloud_alert'', ''sensor.mt_backup_request_alert'',
        ''sensor.mt_camera_policy_alert''] %}{% if states(e) in [''UNKNOWN'',''unknown'',''unavailable''] %}{% set ns.n=ns.n+1 %}{% endif %}{%
        endfor %}{{ ns.n }}'
- triggers:
  - trigger: event
    event_type: metehantech_alert
  sensor:
  - name: MT Alert History
    unique_id: mt_alert_history
    state: '{{ now().isoformat() }}'
    attributes:
      events: '{{ ([dict(timestamp=now().isoformat(), severity=trigger.event.data.severity, source=trigger.event.data.source, message=trigger.event.data.message,
        recovery=trigger.event.data.recovery)] + (this.attributes.events | default([])))[:20] }}'
command_line:
- sensor:
    name: MT Runtime
    unique_id: mt_runtime
    command: cat /config/metehantech_runtime/status.json
    scan_interval: 30
    command_timeout: 5
    value_template: '{{ value_json.updated }}'
    json_attributes:
    - errors
    - metrics_time
    - alerts
    - history
    - backups
    - backup_active
    - backup_request
    - frigate
    - security_events
    - containers
    - container_restarts_10m
shell_command:
  metehantech_backup_pi: python3 /config/metehantech_runtime/request_backup.py pi
  metehantech_backup_pcold: python3 /config/metehantech_runtime/request_backup.py pcold
