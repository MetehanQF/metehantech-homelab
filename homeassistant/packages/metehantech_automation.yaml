timer:
  metehantech_sleep:
    name: Uyku ışığı kapanışı
    duration: 00:02:00
    restore: true
script:
  metehantech_managed_light:
    alias: 'İç kullanım: kontrollü ışık komutu'
    sequence:
    - action: input_datetime.set_datetime
      data:
        timestamp: '{{ as_timestamp(now()) }}'
      target:
        entity_id: '{{ ''input_datetime.metehantech_auto_'' ~ entity.split(''.'')[1] }}'
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ operation == ''off'' }}'
        sequence:
        - action: light.turn_off
          target:
            entity_id: '{{ entity }}'
      - conditions:
        - condition: template
          value_template: '{{ operation == ''rgb'' }}'
        sequence:
        - action: light.turn_on
          data:
            brightness_pct: '{{ brightness | int }}'
            effect: 'Off'
            hs_color:
            - 275
            - 85
          target:
            entity_id: '{{ entity }}'
      default:
      - action: light.turn_on
        data:
          brightness_pct: '{{ brightness | int }}'
          effect: 'Off'
          color_temp_kelvin: '{{ [[kelvin | int, state_attr(entity,''min_color_temp_kelvin'') | int(2500)] | max, state_attr(entity,''max_color_temp_kelvin'')
            | int(6500)] | min }}'
        target:
          entity_id: '{{ entity }}'
    mode: queued
    max: 20
  metehantech_apply_mode:
    alias: 'İç kullanım: ev modu ışıkları'
    sequence:
    - action: timer.cancel
      target:
        entity_id: timer.metehantech_sleep
    - action: input_boolean.turn_off
