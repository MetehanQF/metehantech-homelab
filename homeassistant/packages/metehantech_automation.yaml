      if v|float >= 75 else ''OK'')) }}'
    attributes:
      friendly_label: PcOld sıcaklık
- sensor:
  - name: MT Pcold Disk Alert
    unique_id: mt_pcold_disk_alert
    state: '{% set v=states(''sensor.pcold_disk'') %}{{ ''UNKNOWN'' if not is_number(v) else (''CRITICAL'' if v|float >= 95 else (''WARNING''
      if v|float >= 85 else ''OK'')) }}'
    attributes:
      friendly_label: PcOld disk
- sensor:
  - name: MT Pcold Ram Alert
    unique_id: mt_pcold_ram_alert
    state: '{% set v=states(''sensor.pcold_ram'') %}{{ ''UNKNOWN'' if not is_number(v) else (''CRITICAL'' if v|float >= 101 else (''WARNING''
      if v|float >= 90 else ''OK'')) }}'
    attributes:
      friendly_label: PcOld RAM
- binary_sensor:
  - name: MT pcold CPU Sustained
    unique_id: mt_pcold_cpu_sustained
    state: '{{ states(''sensor.pcold_cpu'') | float(0) > 90 }}'
    availability: '{{ is_number(states(''sensor.pcold_cpu'')) }}'
    delay_on: 00:05:00
- sensor:
  - name: MT Pcold Cpu Alert
    unique_id: mt_pcold_cpu_alert
    state: '{{ ''UNKNOWN'' if states(''binary_sensor.mt_pcold_cpu_sustained'') not in [''on'',''off''] else (''WARNING'' if is_state(''binary_sensor.mt_pcold_cpu_sustained'',''on'')
      else ''OK'') }}'
    attributes:
      friendly_label: PcOld CPU 5 dakika >%90
- sensor:
  - name: MT Pcold Online Alert
    unique_id: mt_pcold_online_alert
    state: '{{ ''OK'' if is_state(''binary_sensor.pcold_online'',''on'') else ''WARNING'' }}'
    attributes:
      friendly_label: PcOld çevrimdışı
- sensor:
  - name: MT Pcold Stale Alert
    unique_id: mt_pcold_stale_alert
    state: '{% set t=(state_attr(''sensor.mt_runtime'',''metrics_time'') or {}).get(''pcold'') %}{% set age=as_timestamp(now())-(t|float(0)) %}{{
