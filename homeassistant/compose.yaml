name: metehantech-homeassistant
services:
  homeassistant:
    container_name: metehantech-homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    platform: linux/arm64
    network_mode: host
    restart: unless-stopped
    environment:
      TZ: Europe/Istanbul
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8123/', timeout=10)"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
